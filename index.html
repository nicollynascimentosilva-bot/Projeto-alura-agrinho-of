<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal AgroVitta | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container Principal com imagem de fundo -->
    <main class="login-wrapper">
        
        <!-- Lado Esquerdo: Boas-vindas e Botões Comerciais -->
        <section class="welcome-side">
            <div class="brand">
                <span class="logo-icon">🌱</span>
                <h1>Agro<span>Vitta</span></h1>
            </div>
            <div class="welcome-text">
                <h2>Do Campo à Mesa, com inteligência.</h2>
                <p>Acesse nossa plataforma corporativa para monitorar lotes, rastrear entregas ou gerenciar plantios em tempo real.</p>
            </div>
            <div class="action-buttons">
                <button class="btn-secondary" onclick="alert('Conhecer nossa história...')">Nossa Tecnologia</button>
                <button class="btn-secondary" onclick="alert('Indo para o site público...')">Ver Receitas</button>
            </div>
        </section>

        <!-- Lado Direito: Formulário de Autenticação -->
        <section class="login-side">
            <div class="login-box">
                <h3>Acesse sua Conta</h3>
                <p class="subtitle">Insira suas credenciais para entrar no painel</p>

                <form onsubmit="realizarLogin(event)">
                    <div class="input-group">
                        <label for="usuario">Nome de Usuário ou E-mail</label>
                        <input type="text" id="usuario" placeholder="exemplo@agrovitta.com" required>
                    </div>

                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="••••••••" required>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox"> Lembrar-me
                        </label>
                        <a href="#" class="forgot-pass">Esqueceu a senha?</a>
                    </div>

                    <button type="submit" class="btn-primary">Entrar no Sistema</button>
                </form>

                <div class="login-footer">
                    <p>Novo por aqui? <a href="#">Solicite acesso à sua fazenda</a></p>
                </div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
